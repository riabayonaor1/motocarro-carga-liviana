const ns='http://www.w3.org/2000/svg';function gear(id,n,r,color){const g=document.getElementById(id);const c=document.createElementNS(ns,'circle');c.setAttribute('r',r-7);c.setAttribute('fill','#413b31');c.setAttribute('stroke',color);c.setAttribute('stroke-width','4');g.append(c);for(let i=0;i<n;i++){const t=document.createElementNS(ns,'rect');t.setAttribute('x',r-8);t.setAttribute('y','-4');t.setAttribute('width','11');t.setAttribute('height','8');t.setAttribute('fill',color);t.setAttribute('transform',`rotate(${i/n*360})`);g.append(t)}const hub=document.createElementNS(ns,'circle');hub.setAttribute('r',r*.23);hub.setAttribute('fill',color);g.append(hub);const marker=document.createElementNS(ns,'circle');marker.setAttribute('cx','0');marker.setAttribute('cy',-r*.65);marker.setAttribute('r','5');marker.setAttribute('fill','#f8f0df');g.append(marker)}gear('input',12,34,'#ff9d77');gear('output',36,88,'#edd59e');
